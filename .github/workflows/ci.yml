name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: cinematch
          POSTGRES_USER: cinematch
          POSTGRES_PASSWORD: cinematch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinematch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CINEMATCH_DATABASE_URL: postgresql+psycopg://cinematch:cinematch@localhost:5432/cinematch
      CINEMATCH_JWT_SECRET: ci-only-secret-that-is-at-least-32-bytes
      CINEMATCH_POSTER_LOOKUP: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run mypy backend recommender

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
